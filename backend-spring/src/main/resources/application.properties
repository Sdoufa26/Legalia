# ============================================
# LEGALIA - Configuration
# ============================================

# Application
spring.application.name=Legalia
server.port=8080

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/legalia_db
spring.datasource.username=legalia_user
spring.datasource.password=legalia_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.frontend-url=http://localhost:4200

# JWT
app.jwt.secret=legalia-secret-key-a-changer-en-production
app.jwt.expiration-ms=86400000
