# ============================================
# LEGALIA - Configuration
# ============================================

# Application
spring.application.name=Legalia
server.port=8080

# Base de données PostgreSQL (IPv6 requis pour Supabase)
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.gnzsxjiqqoxzduvcggnh
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.frontend-url=http://localhost:4200

# JWT
app.jwt.secret=legalia-secret-key-a-changer-en-production
app.jwt.expiration-ms=86400000

# Service IA (FastAPI — port 8000)
app.ai-service.url=http://127.0.0.1:8000

# Upload de fichiers
app.upload.dir=uploads/
app.upload.max-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_EMAIL}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true