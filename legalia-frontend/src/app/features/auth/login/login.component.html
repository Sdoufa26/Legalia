<div class="page">

  <div class="card">

    <div class="logo">
      <span class="logo-icon">⚖️</span>
      <span class="logo-text">LEGALIA</span>
    </div>

    <h1 class="title">Bienvenue</h1>
    <p class="subtitle">Connectez-vous à votre espace LEGALIA</p>

    <!-- Message d'erreur -->
    <div class="error-banner" *ngIf="errorMessage">
      ⚠️ {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input
            id="email"
            type="email"
            placeholder="votre@email.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            [disabled]="loading"
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            [disabled]="loading"
          />
        </div>
        <a routerLink="/auth/forgot-password" class="forgot">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn-connect" [disabled]="loading">
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading" class="spinner">Connexion...</span>
      </button>

    </form>

    <hr class="divider" />

    <p class="register-link">
      Pas encore de compte ?
      <a routerLink="/auth/register">Demander un accès</a>
    </p>

  </div>

  <a routerLink="/" class="back-link">← Retour à l'accueil</a>

</div>
