<div class="page">
  <div class="card">

    <div class="logo">
      <span class="logo-icon">⚖️</span>
      <span class="logo-text">LEGALIA</span>
    </div>

    <h1 class="title">Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe sécurisé</p>

    <div class="error-banner" *ngIf="errorMessage || tokenInvalid">
      ⚠️ {{ tokenInvalid ? 'Lien invalide. Refaites une demande.' : errorMessage }}
    </div>
    <div class="success-banner" *ngIf="successMessage">✅ {{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()" *ngIf="!tokenInvalid && !successMessage">
      <div class="field">
        <label for="newPassword">Nouveau mot de passe</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="newPassword" type="password" placeholder="Minimum 8 caractères"
                 [(ngModel)]="newPassword" name="newPassword" [disabled]="loading" />
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="confirmPassword" type="password" placeholder="••••••••"
                 [(ngModel)]="confirmPassword" name="confirmPassword" [disabled]="loading" />
        </div>
      </div>

      <button type="submit" class="btn-reset" [disabled]="loading">
        <span *ngIf="!loading">Mettre à jour le mot de passe</span>
        <span *ngIf="loading">Mise à jour...</span>
      </button>
    </form>

    <hr class="divider" />
    <p class="login-link">
      <a routerLink="/auth/login">← Retour à la connexion</a>
    </p>
  </div>
</div>
